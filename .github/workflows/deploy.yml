name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # A hung conversion previously burned the full 6h limit (reported as
    # "cancelled"); fail fast instead.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Convert assets
        # Recursive glob (audio lives in assets/audio/{music,sfx}). No pipe
        # into the loop: ffmpeg grabs the loop's stdin and hangs the job for
        # the full 6h limit — which is what killed the last three deploys.
        # -nostdin -y makes ffmpeg unconditionally non-interactive.
        run: |
          shopt -s globstar nullglob
          for f in assets/**/*.mp3; do
            ffmpeg -nostdin -y -loglevel error -i "$f" -acodec libvorbis "${f%.mp3}.ogg"
            rm "$f"
          done

      - name: Update file references
        run: |
          find . -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" \) -exec sed -i 's/\.mp3/\.ogg/g' {} +

      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4