name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Convert assets
        # Recursive: audio moved into assets/audio/{music,sfx} — the old
        # top-level glob matched nothing, so the sed below rewrote code to
        # .ogg files that never existed and every mp3 sound 404ed on Pages.
        run: |
          find assets -type f -name "*.mp3" -print0 | while IFS= read -r -d '' f; do
            ffmpeg -loglevel error -i "$f" -acodec libvorbis "${f%.mp3}.ogg"
            rm "$f"
          done

      - name: Update file references
        run: |
          find . -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" \) -exec sed -i 's/\.mp3/\.ogg/g' {} +

      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4